version: "2"
linters:
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (net.Conn).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck
      - path: scripts/
        linters:
          - errcheck
