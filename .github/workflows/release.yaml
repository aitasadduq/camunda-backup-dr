name: Release

# Publishing a GitHub release is the whole release process. The tag is the only
# place the version is written: it is stamped into the binary, used as the
# image tag, and used to package the Helm chart. Nothing in the repository is
# bumped by hand.

on:
  release:
    types: [published]

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Derive the version from the release tag
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The version without its "v" has to be valid semver for the chart,
          # so a tag like "release-12" is refused here, before anything is pushed.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yaml

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [version, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamped into the binary as config.ControllerVersion.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            aitasadduq/camunda-backup-controller:${{ needs.version.outputs.tag }}
            aitasadduq/camunda-backup-controller:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that silently ignored VERSION would still push a correctly
      # tagged image whose backups record the wrong controller version.
      - name: Check the pushed image reports this version
        env:
          IMAGE: aitasadduq/camunda-backup-controller:${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          reported="$(docker run --rm --pull always "$IMAGE" -version)"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::$IMAGE reports version '$reported', expected '$VERSION'"
            exit 1
          fi

  chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    # After the image, so a chart is never published for an image that failed
    # to push.
    needs: [version, docker]
    permissions:
      contents: write # upload the chart to the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package the chart for this release
        run: |
          helm package deployments/helm/camunda-backup-controller \
            --version "$VERSION" --app-version "$TAG" --destination dist

      - name: Check the packaged chart deploys this release by default
        run: |
          helm template check "dist/camunda-backup-controller-$VERSION.tgz" > rendered.yaml
          grep 'image:' rendered.yaml | grep -F ":$TAG\""

      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/camunda-backup-controller-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" --clobber
