events {
  worker_connections 128;
}

http {
  server {
    listen 80;

    # Operate actuator — must be before /operate catch-all.
    # Strips /operate prefix: /operate/actuator/health -> operate:9600/actuator/health
    location /operate/actuator {
      proxy_pass http://operate:9600/actuator;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Operate web/API — full path preserved (context path = /operate).
    # /operate/foo -> operate:8080/operate/foo
    location /operate {
      proxy_pass http://operate:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Zeebe actuator — full path preserved.
    # /actuator/health -> zeebe:9600/actuator/health
    location /actuator {
      proxy_pass http://zeebe:9600;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Zeebe REST API (default) — full path preserved.
    # /v2/topology -> zeebe:8080/v2/topology
    location / {
      proxy_pass http://zeebe:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
