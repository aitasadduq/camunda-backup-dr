services:
  backup-controller:
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backup_data:/data
    environment:
      LOG_LEVEL: debug
      DEFAULT_S3_ENDPOINT: http://minio:9000
      DEFAULT_S3_ACCESSKEY: localminio
      DEFAULT_ELASTICSEARCH_ENDPOINT: http://elasticsearch:9200
      DEFAULT_ELASTICSEARCH_USERNAME: elastic
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio12345
    volumes:
      - minio_data:/data
    profiles:
      - minio
      - all
    restart: unless-stopped

  minio-mc:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 localminio localminio12345; do sleep 1; done
        mc mb -p local/es-snapshots || true
    profiles:
      - minio
      - all
    restart: "no"

  elasticsearch:
    image: elasticsearch:9.2.4
    build:
      context: ./elasticsearch
      args:
        ES_IMAGE: elasticsearch:9.2.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=localelastic12345
      - S3_ACCESS_KEY=localminio
      - S3_SECRET_KEY=localminio12345
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    depends_on:
      - minio
    profiles:
      - elasticsearch
      - all
    restart: unless-stopped

volumes:
  backup_data:
    driver: local
  minio_data:
    driver: local
  es_data:
    driver: local