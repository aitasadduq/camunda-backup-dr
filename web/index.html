<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camunda Backup Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'><path stroke-linecap='round' stroke-linejoin='round' d='M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12'/></svg>">
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

    <!-- ==================== Header ==================== -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <!-- Logo & Title -->
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    <h1 class="text-base font-semibold text-gray-900 hidden sm:block">Camunda Backup Controller</h1>
                    <h1 class="text-base font-semibold text-gray-900 sm:hidden">Backup Ctrl</h1>
                </div>

                <!-- Status Indicator -->
                <div class="flex items-center gap-2">
                    <span id="header-status-dot" class="status-dot status-dot-gray"></span>
                    <span class="text-xs text-gray-500 hidden sm:inline">System Status</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== Tab Bar ==================== -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex gap-0 -mb-px">
                <button data-tab="dashboard" class="tab-btn active">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
                        </svg>
                        <span class="hidden sm:inline">Dashboard</span>
                    </span>
                </button>
                <button data-tab="instances" class="tab-btn">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        <span class="hidden sm:inline">Instances</span>
                    </span>
                </button>
                <button data-tab="backups" class="tab-btn">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                        </svg>
                        <span class="hidden sm:inline">Backups</span>
                    </span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ==================== Content Area ==================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Dashboard Tab -->
        <div data-tab-content="dashboard">
            <div id="dashboard-content">
                <div class="flex justify-center py-12">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Instances Tab -->
        <div data-tab-content="instances" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">Camunda Instances</h2>
                <button onclick="openInstanceForm()"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Add Instance
                </button>
            </div>
            <div id="instances-content">
                <div class="flex justify-center py-12">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- Backups Tab -->
        <div data-tab-content="backups" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">Backup History</h2>
            </div>
            <div id="backups-controls" class="mb-4">
                <!-- Instance selector + filter buttons rendered by JS -->
            </div>
            <div id="backups-table-container">
                <div class="empty-state">
                    <p class="text-gray-500">Select an instance to view backup history.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- ==================== Modal Container ==================== -->
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div id="modal-panel" class="modal-panel"></div>

    <!-- ==================== Toast Container ==================== -->
    <div id="toast-container" class="toast-container"></div>

    <!-- ==================== Scripts ==================== -->
    <script src="/js/app.js"></script>

</body>
</html>
